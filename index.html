<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gym Tracker</title>

<style>
body{
font-family:Arial;
background:#f3f4f6;
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
max-width:700px;
margin:auto;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
background:#2563eb;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="card" id="authBox">

<h1>Gym Tracker</h1>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="signupBtn">Sign Up</button>

<button id="loginBtn">
Login
</button>

</div>

<div class="card hidden" id="app">

<h2>Başarıyla giriş yaptın</h2>

<p id="userText"></p>

<button id="logoutBtn">
Logout
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyCJy3O5GgABLuEi9pJ2C9yp_uxTl1NKbIU",

authDomain: "ib-tracker-3fa15.firebaseapp.com",

projectId: "ib-tracker-3fa15",

storageBucket: "ib-tracker-3fa15.firebasestorage.app",

messagingSenderId: "1084870933621",

appId: "1:1084870933621:web:42aaf1a1c273f2e6fb8c3c",

measurementId: "G-SHTVY448SY"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

document.getElementById("signupBtn")
.onclick = async () => {

try{

await createUserWithEmailAndPassword(
auth,
emailInput.value,
passwordInput.value
);

alert("Hesap oluşturuldu");

}catch(err){

alert(err.message);

}

};

document.getElementById("loginBtn")
.onclick = async () => {

try{

await signInWithEmailAndPassword(
auth,
emailInput.value,
passwordInput.value
);

}catch(err){

alert(err.message);

}

};

document.getElementById("logoutBtn")
.onclick = () => {

signOut(auth);

};

onAuthStateChanged(auth, user => {

if(user){

document
.getElementById("authBox")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

document
.getElementById("userText")
.innerText = user.email;

}else{

document
.getElementById("authBox")
.classList.remove("hidden");

document
.getElementById("app")
.classList.add("hidden");

}

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gym Compliance Tracker</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.container{max-width:1200px;margin:30px auto;padding:20px}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
input,select,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid #d1d5db;font-size:14px}
textarea{min-height:70px;resize:vertical}
button{cursor:pointer;border:none;font-weight:bold;margin-top:8px}
.btn{background:#2563eb;color:white}
.btn-green{background:#16a34a;color:white}
.btn-red{background:#dc2626;color:white}
.btn-gray{background:#6b7280;color:white}
.hidden{display:none}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{width:auto;background:white;border:1px solid #d1d5db;padding:12px 18px;border-radius:999px;font-weight:bold}
.tab-btn.active{background:#2563eb;color:white}
.tab-content{display:none}
.tab-content.active{display:block}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.exercise,.check-item{background:#f9fafb;padding:14px;border-radius:12px;margin-bottom:10px;border:1px solid #e5e7eb}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold;margin:4px}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#dcfce7;color:#166534}
.badge-orange{background:#ffedd5;color:#9a3412}
.progress{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:#2563eb;width:0%}
.small{font-size:13px;color:#6b7280}
.note{margin-top:8px;background:#f3f4f6;padding:10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.stat{font-size:28px;font-weight:bold}
.check-row{display:flex;align-items:flex-start;gap:10px}
.check-row input{width:auto;margin-top:3px}
</style>
</head>

<body>
<div class="container">
<h1>Gym Compliance Tracker</h1>

<div id="authBox" class="card">
<h2>Login / Sign Up</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="signUp()">Sign Up</button>
<button class="btn-gray" onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
<div class="card">
<p>Hoş geldin: <b id="userEmail"></b></p>
<button class="btn-gray" onclick="logout()">Çıkış</button>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('todayTab',this)">Bugün</button>
<button class="tab-btn" onclick="switchTab('workoutTab',this)">Workout</button>
<button class="tab-btn" onclick="switchTab('nutritionTab',this)">Beslenme</button>
<button class="tab-btn" onclick="switchTab('programTab',this)">Program</button>
<button class="tab-btn" onclick="switchTab('historyTab',this)">Geçmiş</button>
<button class="tab-btn" onclick="switchTab('progressTab',this)">Progress</button>
</div>

<div id="todayTab" class="tab-content active">
<div class="card">
<h2>Bugünkü Özet</h2>
<input id="summaryDate" type="date" onchange="renderTodaySummary()">

<div class="grid grid-3" style="margin-top:12px">
<div>
<h3>Antrenman Uyumu</h3>
<div class="stat" id="todayWorkoutPercent">0%</div>
<div class="progress"><div id="todayWorkoutBar" class="progress-fill"></div></div>
</div>

<div>
<h3>Beslenme Uyumu</h3>
<div class="stat" id="todayNutritionPercent">0%</div>
<div class="progress"><div id="todayNutritionBar" class="progress-fill"></div></div>
</div>

<div>
<h3>Haftalık Antrenman</h3>
<div class="stat" id="weeklyWorkoutCount">0</div>
</div>
</div>
</div>
</div>

<div id="workoutTab" class="tab-content">
<div class="card">
<h2>Workout Kaydı</h2>

<div class="grid grid-2">
<input id="workoutDate" type="date">
<select id="workoutDay" onchange="renderWorkoutChecklist()">
<option value="">Antrenman günü seç</option>
<option value="Upper Day">Upper Day</option>
<option value="Lower Day">Lower Day</option>
<option value="Push Day">Push Day</option>
<option value="Pull Day">Pull Day</option>
<option value="Leg Day">Leg Day</option>
<option value="Rest/Cardio">Rest / Cardio</option>
</select>
</div>

<div id="workoutChecklist" style="margin-top:15px"></div>
<textarea id="workoutNote" placeholder="Antrenman notu"></textarea>
<button class="btn-green" onclick="saveWorkout()">Workout Kaydet</button>
</div>
</div>

<div id="nutritionTab" class="tab-content">
<div class="card">
<h2>Beslenme Kaydı</h2>
<input id="nutritionDate" type="date">
<div id="nutritionChecklist" style="margin-top:15px"></div>
<textarea id="nutritionNote" placeholder="Beslenme notu"></textarea>
<button class="btn-green" onclick="saveNutrition()">Beslenmeyi Kaydet</button>
</div>
</div>

<div id="programTab" class="tab-content">
<div class="card">
<h2>Program</h2>
<div id="programList"></div>
</div>
</div>

<div id="historyTab" class="tab-content">
<div class="card">
<h2>Geçmiş</h2>
<div id="historyList"></div>
</div>
</div>

<div id="progressTab" class="tab-content">
<div class="grid grid-3">
<div class="card"><h3>Workout Kaydı</h3><div class="stat" id="totalWorkoutDays">0</div></div>
<div class="card"><h3>Beslenme Kaydı</h3><div class="stat" id="totalNutritionDays">0</div></div>
<div class="card"><h3>Ortalama Uyum</h3><div class="stat" id="avgCompliance">0%</div></div>
</div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  query,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJy3O5GgABLuEi9pJ2C9yp_uxTl1NKbIU",
  authDomain: "ib-tracker-3fa15.firebaseapp.com",
  projectId: "ib-tracker-3fa15",
  storageBucket: "ib-tracker-3fa15.firebasestorage.app",
  messagingSenderId: "1084870933621",
  appId: "1:1084870933621:web:42aaf1a1c273f2e6fb8c3c",
  measurementId: "G-SHTVY448SY"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let currentUser = null;
let workoutLogs = [];
let nutritionLogs = [];

const program = {
  "Upper Day": [
    ["Machine Fly","3x12","Göğsü maksimum aç, ortada 1 sn sık."],
    ["Incline Smith Press","4x8-10","Negatif 2-3 sn, üstte kilitleme."],
    ["Lat Pulldown","4x10","Göğse doğru çek."],
    ["Wide Grip Row","3x12","Upper back odaklı."],
    ["Lateral Raise","3x15","Form odaklı."],
    ["Face Pull","3x15","Arka omuz sık."],
    ["Barbell Curl","3x10","Negatif yavaş."],
    ["Rope Pushdown","3x12","Triceps sık."]
  ],
  "Lower Day": [
    ["Squat","4x6-8","Core sıkı."],
    ["Leg Press","3x10","Kontrollü indir."],
    ["Romanian Deadlift","3x8-10","Hamstring gerilimini hisset."],
    ["Leg Curl","3x12","Üstte 1 sn sık."],
    ["Standing Calf Raise","4x15-20","Üstte sık."],
    ["Cable Crunch","3x12-15","Karından bükül."]
  ],
  "Push Day": [
    ["Machine Fly","3x12","1 ısınma + 2 work set."],
    ["Incline Chest Machine","3x12","Üst göğüste sık."],
    ["Cable Crossover","3x15","Ortada 1 sn sık."],
    ["Machine Shoulder Press","3x12","Kilitleme yapma."],
    ["Cable Lateral Raise","4x15","Form odaklı."],
    ["Lying Triceps Extension","3x12","Dirsek sabit."],
    ["Rope Pushdown","3x12","Kontrollü bırak."]
  ],
  "Pull Day": [
    ["T-Bar Row","4x10","Barı alt göğse çek."],
    ["Reverse Grip Pulldown","3x12","Lat odaklı."],
    ["One Arm Dumbbell Row","3x10","Sırtı 1 sn tut."],
    ["Seated Cable Row","3x12","Kürekleri sık."],
    ["Rear Delt Fly","3x15","Arka omuz."],
    ["Hammer Curl","3x10","Kontrollü."],
    ["Incline Dumbbell Curl","2x12","Biceps esnet."]
  ],
  "Leg Day": [
    ["Leg Extension","4x12","Üstte 1 sn sık."],
    ["Lying Leg Curl","4x12","Hamstring odaklı."],
    ["Bulgarian Split Squat","3x10 each leg","Kalça + quad."],
    ["Walking Lunge","3x12 each leg","Kontrollü."],
    ["Leg Press","2x20","Yanma odaklı."],
    ["Standing Calf Raise","4x20","Yarım tekrar yok."]
  ],
  "Rest/Cardio": [
    ["Cardio","20-30 dk","110-130 bpm."],
    ["Weighted Crunch","3x15","Kardiyo sonrası."],
    ["Reverse Crunch","3x15","Kardiyo sonrası."]
  ]
};

const nutritionItems = [
  "Elma sirkesi",
  "Yarım limon",
  "Kardiyo öncesi kahve",
  "Öğün 1 tam",
  "Öğün 2 tam",
  "Öğün 3 tam",
  "Öğün 4 tam",
  "4 litre su",
  "2 bardak kahve/yeşil çay",
  "Magnesium",
  "Berberin",
  "D3K2",
  "Omega 3"
];

function today(){
  return new Date().toISOString().split("T")[0];
}

function percent(done,total){
  return total ? Math.round((done / total) * 100) : 0;
}

document.getElementById("summaryDate").value = today();
document.getElementById("workoutDate").value = today();
document.getElementById("nutritionDate").value = today();

window.signUp = async function(){
  try{
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    await createUserWithEmailAndPassword(auth,email,password);
  }catch(e){
    alert(e.message);
  }
};

window.login = async function(){
  try{
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    alert(e.message);
  }
};

window.logout = function(){
  signOut(auth);
};

onAuthStateChanged(auth,user=>{
  if(user){
    currentUser = user;
    document.getElementById("authBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("userEmail").textContent = user.email;
    loadData();
  }else{
    currentUser = null;
    document.getElementById("authBox").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
});

window.switchTab = function(id,btn){
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
};

function renderProgram(){
  const programList = document.getElementById("programList");

  programList.innerHTML = Object.entries(program).map(([day,arr])=>`
    <div class="card">
      <h3>${day}</h3>
      ${arr.map(x=>`
        <div class="exercise">
          <b>${x[0]}</b>
          <span class="badge badge-blue">${x[1]}</span>
          <div class="small">${x[2]}</div>
        </div>
      `).join("")}
    </div>
  `).join("");
}

window.renderWorkoutChecklist = function(){
  const day = document.getElementById("workoutDay").value;
  const workoutChecklist = document.getElementById("workoutChecklist");

  if(!day){
    workoutChecklist.innerHTML = "";
    return;
  }

  workoutChecklist.innerHTML = program[day].map((ex,i)=>`
    <div class="exercise">
      <label class="check-row">
        <input type="checkbox" id="ex_${i}">
        <span>
          <b>${ex[0]}</b>
          <span class="badge badge-blue">${ex[1]}</span>
        </span>
      </label>

      <div class="small">${ex[2]}</div>

      <div class="grid grid-3" style="margin-top:8px">
        <input id="sets_${i}" placeholder="Set">
        <input id="reps_${i}" placeholder="Reps">
        <input id="kg_${i}" placeholder="Kg">
      </div>

      <textarea id="note_${i}" placeholder="Not"></textarea>
    </div>
  `).join("");
};

function renderNutritionChecklist(){
  const nutritionChecklist = document.getElementById("nutritionChecklist");

  nutritionChecklist.innerHTML = nutritionItems.map((x,i)=>`
    <div class="check-item">
      <label class="check-row">
        <input type="checkbox" id="nutri_${i}">
        <span>${x}</span>
      </label>
    </div>
  `).join("");
}

window.saveWorkout = async function(){
  const day = document.getElementById("workoutDay").value;
  const workoutDate = document.getElementById("workoutDate").value;
  const workoutNote = document.getElementById("workoutNote").value;

  if(!currentUser) return alert("Önce giriş yap.");
  if(!day) return alert("Antrenman günü seç.");

  let done = 0;

  const entries = program[day].map((ex,i)=>{
    const checked = document.getElementById(`ex_${i}`).checked;
    if(checked) done++;

    return {
      name: ex[0],
      target: ex[1],
      completed: checked,
      sets: document.getElementById(`sets_${i}`).value,
      reps: document.getElementById(`reps_${i}`).value,
      kg: document.getElementById(`kg_${i}`).value,
      note: document.getElementById(`note_${i}`).value
    };
  });

  const p = percent(done,entries.length);

  await addDoc(collection(db,"gymWorkoutLogs"),{
    userId: currentUser.uid,
    date: workoutDate,
    day,
    entries,
    percent: p,
    note: workoutNote,
    createdAt: serverTimestamp()
  });

  alert("Workout kaydedildi.");

  document.getElementById("workoutDay").value = "";
  document.getElementById("workoutChecklist").innerHTML = "";
  document.getElementById("workoutNote").value = "";
};

window.saveNutrition = async function(){
  if(!currentUser) return alert("Önce giriş yap.");

  let done = 0;
  const completed = {};

  nutritionItems.forEach((_,i)=>{
    const c = document.getElementById(`nutri_${i}`).checked;
    completed[i] = c;
    if(c) done++;
  });

  const p = percent(done,nutritionItems.length);

  await addDoc(collection(db,"gymNutritionLogs"),{
    userId: currentUser.uid,
    date: document.getElementById("nutritionDate").value,
    completed,
    percent: p,
    note: document.getElementById("nutritionNote").value,
    createdAt: serverTimestamp()
  });

  alert("Beslenme kaydedildi.");

  document.getElementById("nutritionNote").value = "";
  renderNutritionChecklist();
};

window.renderTodaySummary = function(){
  const d = document.getElementById("summaryDate").value;

  const w = workoutLogs.find(x=>x.date===d);
  const n = nutritionLogs.find(x=>x.date===d);

  const wp = w ? w.percent : 0;
  const np = n ? n.percent : 0;

  document.getElementById("todayWorkoutPercent").textContent = wp + "%";
  document.getElementById("todayWorkoutBar").style.width = wp + "%";

  document.getElementById("todayNutritionPercent").textContent = np + "%";
  document.getElementById("todayNutritionBar").style.width = np + "%";
};

function renderHistory(){
  const historyList = document.getElementById("historyList");

  const dates = [...new Set([
    ...workoutLogs.map(x=>x.date),
    ...nutritionLogs.map(x=>x.date)
  ])].sort().reverse();

  if(dates.length===0){
    historyList.innerHTML = `<div class="small">Henüz kayıt yok.</div>`;
    return;
  }

  historyList.innerHTML = dates.map(d=>{
    const w = workoutLogs.find(x=>x.date===d);
    const n = nutritionLogs.find(x=>x.date===d);

    return `
      <div class="card">
        <h3>${d}</h3>

        <span class="badge ${w && w.percent>=80 ? "badge-green" : "badge-orange"}">
          Workout: ${w ? w.percent : 0}%
        </span>

        <span class="badge ${n && n.percent>=80 ? "badge-green" : "badge-orange"}">
          Beslenme: ${n ? n.percent : 0}%
        </span>

        ${w ? `
          <div class="note">
            <b>${w.day}</b><br>
            Eksik: ${(w.entries || []).filter(e=>!e.completed).map(e=>e.name).join(", ") || "Yok"}
          </div>
          <button class="btn-red" onclick="deleteWorkout('${w.id}')">Workout Sil</button>
        ` : ""}

        ${n ? `
          <div class="note">Beslenme notu: ${n.note || "-"}</div>
          <button class="btn-red" onclick="deleteNutrition('${n.id}')">Beslenme Sil</button>
        ` : ""}
      </div>
    `;
  }).join("");
}

window.deleteWorkout = function(id){
  deleteDoc(doc(db,"gymWorkoutLogs",id));
};

window.deleteNutrition = function(id){
  deleteDoc(doc(db,"gymNutritionLogs",id));
};

function renderStats(){
  document.getElementById("totalWorkoutDays").textContent = workoutLogs.length;
  document.getElementById("totalNutritionDays").textContent = nutritionLogs.length;

  const all = [
    ...workoutLogs.map(x=>x.percent || 0),
    ...nutritionLogs.map(x=>x.percent || 0)
  ];

  const avg = all.length ? Math.round(all.reduce((a,b)=>a+b,0)/all.length) : 0;
  document.getElementById("avgCompliance").textContent = avg + "%";

  const now = new Date();
  const weekAgo = new Date();
  weekAgo.setDate(now.getDate()-7);

  const weekly = workoutLogs.filter(x=>new Date(x.date)>=weekAgo).length;
  document.getElementById("weeklyWorkoutCount").textContent = weekly;

  window.renderTodaySummary();
}

function loadData(){
  onSnapshot(query(collection(db,"gymWorkoutLogs")),snap=>{
    workoutLogs = snap.docs
      .map(d=>({id:d.id,...d.data()}))
      .filter(x=>x.userId===currentUser.uid)
      .sort((a,b)=>(b.date || "").localeCompare(a.date || ""));

    renderHistory();
    renderStats();
  });

  onSnapshot(query(collection(db,"gymNutritionLogs")),snap=>{
    nutritionLogs = snap.docs
      .map(d=>({id:d.id,...d.data()}))
      .filter(x=>x.userId===currentUser.uid)
      .sort((a,b)=>(b.date || "").localeCompare(a.date || ""));

    renderHistory();
    renderStats();
  });
}

renderProgram();
renderNutritionChecklist();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gym Compliance Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.container{max-width:1200px;margin:30px auto;padding:20px}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
input,select,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid #d1d5db;font-size:14px}
textarea{min-height:70px;resize:vertical}
button{cursor:pointer;border:none;font-weight:bold;margin-top:8px}
.btn{background:#2563eb;color:white}.btn-green{background:#16a34a;color:white}.btn-red{background:#dc2626;color:white}.btn-gray{background:#6b7280;color:white}
.hidden{display:none}.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{width:auto;background:white;border:1px solid #d1d5db;padding:12px 18px;border-radius:999px;font-weight:bold}
.tab-btn.active{background:#2563eb;color:white;border-color:#2563eb}
.tab-content{display:none}.tab-content.active{display:block}
.grid{display:grid;gap:12px}.grid-2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.exercise,.check-item{background:#f9fafb;padding:14px;border-radius:12px;margin-bottom:10px;border:1px solid #e5e7eb}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold;margin:4px 4px 4px 0}
.badge-blue{background:#dbeafe;color:#1d4ed8}.badge-green{background:#dcfce7;color:#166534}.badge-orange{background:#ffedd5;color:#9a3412}
.progress{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:#2563eb;width:0%}
.small{font-size:13px;color:#6b7280}.note{margin-top:8px;background:#f3f4f6;padding:10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.stat{font-size:28px;font-weight:bold}
.check-row{display:flex;align-items:flex-start;gap:10px}.check-row input{width:auto;margin-top:3px}
</style>
</head>
<body>
<div class="container">
<h1>Gym Compliance Tracker</h1>

<div id="authBox" class="card">
<h2>Login / Sign Up</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="signUp()">Sign Up</button>
<button class="btn-gray" onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
<div class="card">
<p>Hoş geldin: <b id="userEmail"></b></p>
<button class="btn-gray" onclick="logout()">Çıkış</button>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('todayTab', this)">Bugün</button>
<button class="tab-btn" onclick="switchTab('workoutTab', this)">Antrenman</button>
<button class="tab-btn" onclick="switchTab('nutritionTab', this)">Beslenme</button>
<button class="tab-btn" onclick="switchTab('programTab', this)">Program</button>
<button class="tab-btn" onclick="switchTab('historyTab', this)">Geçmiş</button>
</div>

<div id="todayTab" class="tab-content active">
<div class="grid grid-3">
<div class="card"><h3>Bugünkü Antrenman</h3><div class="stat" id="todayWorkoutPercent">0%</div><div class="progress"><div id="todayWorkoutBar" class="progress-fill"></div></div></div>
<div class="card"><h3>Bugünkü Beslenme</h3><div class="stat" id="todayNutritionPercent">0%</div><div class="progress"><div id="todayNutritionBar" class="progress-fill"></div></div></div>
<div class="card"><h3>Haftalık Antrenman</h3><div class="stat" id="weeklyWorkoutCount">0</div></div>
</div>
</div>

<div id="workoutTab" class="tab-content">
<div class="card">
<h2>Antrenman Kaydı</h2>
<input id="workoutDate" type="date">
<select id="workoutDay" onchange="renderWorkoutChecklist()">
<option value="">Antrenman günü seç</option>
<option value="Upper Day">Upper Day</option>
<option value="Lower Day">Lower Day</option>
<option value="Push Day">Push Day</option>
<option value="Pull Day">Pull Day</option>
<option value="Leg Day">Leg Day</option>
<option value="Rest/Cardio">Rest / Cardio</option>
</select>
<div id="workoutChecklist" style="margin-top:15px;"></div>
<textarea id="workoutNote" placeholder="Antrenman notu"></textarea>
<button class="btn-green" onclick="saveWorkoutLog()">Antrenmanı Kaydet</button>
</div>
</div>

<div id="nutritionTab" class="tab-content">
<div class="card">
<h2>Beslenme Kaydı</h2>
<input id="nutritionDate" type="date">
<div id="nutritionChecklist"></div>
<textarea id="nutritionNote" placeholder="Beslenme notu"></textarea>
<button class="btn-green" onclick="saveNutritionLog()">Beslenmeyi Kaydet</button>
</div>
</div>

<div id="programTab" class="tab-content">
<div class="card"><h2>Antrenman Programı</h2><div id="programList"></div></div>
</div>

<div id="historyTab" class="tab-content">
<div class="card"><h2>Antrenman Geçmişi</h2><div id="workoutHistory"></div></div>
<div class="card"><h2>Beslenme Geçmişi</h2><div id="nutritionHistory"></div></div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,query,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCJy3O5GgABLuEi9pJ2C9yp_uxTl1NKbIU",
authDomain:"ib-tracker-3fa15.firebaseapp.com",
projectId:"ib-tracker-3fa15",
storageBucket:"ib-tracker-3fa15.firebasestorage.app",
messagingSenderId:"1084870933621",
appId:"1:1084870933621:web:42aaf1a1c273f2e6fb8c3c",
measurementId:"G-SHTVY448SY"
};

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);
let currentUser=null, workoutLogs=[], nutritionLogs=[];

const program={
"Upper Day":[["Machine Fly","3x12"],["Incline Smith Press","4x8-10"],["Lat Pulldown","4x10"],["Wide Grip Row","3x12"],["Lateral Raise","3x15"],["Face Pull","3x15"],["Barbell Curl","3x10"],["Rope Pushdown","3x12"]],
"Lower Day":[["Squat","4x6-8"],["Leg Press","3x10"],["Romanian Deadlift","3x8-10"],["Leg Curl","3x12"],["Standing Calf Raise","4x15-20"],["Cable Crunch","3x12-15"]],
"Push Day":[["Machine Fly","3x12"],["Incline Chest Machine","3x12"],["Cable Crossover","3x15"],["Machine Shoulder Press","3x12"],["Cable Lateral Raise","4x15"],["Lying Triceps Extension","3x12"],["Rope Pushdown","3x12"]],
"Pull Day":[["T-Bar Row","4x10"],["Reverse Grip Pulldown","3x12"],["One Arm Dumbbell Row","3x10"],["Seated Cable Row","3x12"],["Rear Delt Fly","3x15"],["Hammer Curl","3x10"],["Incline Dumbbell Curl","2x12"]],
"Leg Day":[["Leg Extension","4x12"],["Lying Leg Curl","4x12"],["Bulgarian Split Squat","3x10 each leg"],["Walking Lunge","3x12 each leg"],["Leg Press","2x20"],["Standing Calf Raise","4x20"]],
"Rest/Cardio":[["Cardio","20-30 dk"],["Weighted Crunch","3x15"],["Reverse Crunch","3x15"]]
};

const nutritionItems=[
"Elma sirkesi","Yarım limon","Kardiyo öncesi kahve","Öğün 1: yumurta","Öğün 1: yulaf/rice cream","Öğün 1: meyve","Öğün 1: tarçın/kakao",
"Öğün 2: tavuk/hindi","Öğün 2: basmati","Öğün 2: zeytinyağı","Öğün 2: salata/sebze",
"Öğün 3: protein","Öğün 3: basmati","Öğün 3: zeytinyağı",
"Öğün 4: protein","Öğün 4: patates/tatlı patates","Öğün 4: zeytinyağı",
"4 litre su","2 bardak kahve/yeşil çay","Magnesium","Berberin","D3K2","Omega 3"
];

function today(){return new Date().toISOString().split("T")[0]}
workoutDate.value=today(); nutritionDate.value=today();

window.signUp=async()=>{try{await createUserWithEmailAndPassword(auth,email.value,password.value)}catch(e){alert(e.message)}};
window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(e){alert(e.message)}};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
if(user){currentUser=user;authBox.classList.add("hidden");app.classList.remove("hidden");userEmail.textContent=user.email;loadData()}
else{currentUser=null;authBox.classList.remove("hidden");app.classList.add("hidden")}
});

window.switchTab=(id,btn)=>{
document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
document.getElementById(id).classList.add("active");btn.classList.add("active");
};

function renderProgram(){
programList.innerHTML=Object.entries(program).map(([day,exs])=>`
<div class="card"><h3>${day}</h3>${exs.map(e=>`<div class="exercise"><b>${e[0]}</b> <span class="badge badge-blue">${e[1]}</span></div>`).join("")}</div>
`).join("");
}

window.renderWorkoutChecklist=()=>{
const day=workoutDay.value;if(!day){workoutChecklist.innerHTML="";return}
workoutChecklist.innerHTML=program[day].map((e,i)=>`
<div class="exercise">
<label class="check-row"><input type="checkbox" id="ex_${i}" onchange="liveWorkout()"> <span><b>${e[0]}</b> <span class="badge badge-blue">${e[1]}</span></span></label>
<div class="grid grid-3" style="margin-top:8px"><input id="sets_${i}" placeholder="Set"><input id="reps_${i}" placeholder="Reps"><input id="kg_${i}" placeholder="Kg"></div>
<textarea id="note_${i}" placeholder="Not"></textarea>
</div>`).join("");
liveWorkout();
};

window.liveWorkout=()=>{
const day=workoutDay.value;if(!day)return;
let done=0,total=program[day].length;
for(let i=0;i<total;i++)if(document.getElementById(`ex_${i}`).checked)done++;
let p=Math.round(done/total*100);
todayWorkoutPercent.textContent=p+"%";todayWorkoutBar.style.width=p+"%";
};

function renderNutritionChecklist(){
nutritionChecklist.innerHTML=nutritionItems.map((x,i)=>`
<div class="check-item"><label class="check-row"><input type="checkbox" id="nut_${i}" onchange="liveNutrition()"> <span>${x}</span></label></div>`).join("");
}

window.liveNutrition=()=>{
let done=0;
nutritionItems.forEach((_,i)=>{if(document.getElementById(`nut_${i}`).checked)done++});
let p=Math.round(done/nutritionItems.length*100);
todayNutritionPercent.textContent=p+"%";todayNutritionBar.style.width=p+"%";
};

window.saveWorkoutLog=async()=>{
const day=workoutDay.value;if(!day)return alert("Antrenman günü seç.");
let done=0;
const entries=program[day].map((e,i)=>{
let completed=document.getElementById(`ex_${i}`).checked;if(completed)done++;
return{name:e[0],target:e[1],completed,sets:sets_${i}.value,reps:reps_${i}.value,kg:kg_${i}.value,note:note_${i}.value}
});
let percent=Math.round(done/entries.length*100);
await addDoc(collection(db,"gymWorkoutLogs"),{userId:currentUser.uid,date:workoutDate.value,day,entries,percent,note:workoutNote.value,createdAt:serverTimestamp()});
alert("Antrenman kaydedildi.");workoutDay.value="";workoutChecklist.innerHTML="";workoutNote.value="";
};

window.saveNutritionLog=async()=>{
let done=0,completed={};
nutritionItems.forEach((_,i)=>{let c=document.getElementById(`nut_${i}`).checked;completed[i]=c;if(c)done++});
let percent=Math.round(done/nutritionItems.length*100);
await addDoc(collection(db,"gymNutritionLogs"),{userId:currentUser.uid,date:nutritionDate.value,completed,percent,note:nutritionNote.value,createdAt:serverTimestamp()});
alert("Beslenme kaydedildi.");nutritionNote.value="";renderNutritionChecklist();liveNutrition();
};

function renderHistories(){
workoutHistory.innerHTML=workoutLogs.length?workoutLogs.map(w=>`
<div class="card"><h3>${w.date} — ${w.day}</h3><span class="badge ${w.percent>=80?"badge-green":"badge-orange"}">${w.percent}% uyum</span>
${w.entries.filter(e=>!e.completed).length?`<div class="note"><b>Eksikler:</b><br>${w.entries.filter(e=>!e.completed).map(e=>e.name).join("<br>")}</div>`:""}
${w.note?`<div class="note">${w.note}</div>`:""}<button class="btn-red" onclick="deleteWorkout('${w.id}')">Sil</button></div>`).join(""):"Henüz antrenman kaydı yok.";

nutritionHistory.innerHTML=nutritionLogs.length?nutritionLogs.map(n=>{
let miss=nutritionItems.filter((_,i)=>!n.completed[i]);
return `<div class="card"><h3>${n.date}</h3><span class="badge ${n.percent>=80?"badge-green":"badge-orange"}">${n.percent}% uyum</span>
${miss.length?`<div class="note"><b>Eksikler:</b><br>${miss.slice(0,10).join("<br>")}${miss.length>10?"<br>...":""}</div>`:""}
${n.note?`<div class="note">${n.note}</div>`:""}<button class="btn-red" onclick="deleteNutrition('${n.id}')">Sil</button></div>`;
}).join(""):"Henüz beslenme kaydı yok.";
}

window.deleteWorkout=id=>deleteDoc(doc(db,"gymWorkoutLogs",id));
window.deleteNutrition=id=>deleteDoc(doc(db,"gymNutritionLogs",id));

function renderStats(){
let todayW=workoutLogs.find(x=>x.date===today());
let todayN=nutritionLogs.find(x=>x.date===today());
let wp=todayW?todayW.percent:0,np=todayN?todayN.percent:0;
todayWorkoutPercent.textContent=wp+"%";todayWorkoutBar.style.width=wp+"%";
todayNutritionPercent.textContent=np+"%";todayNutritionBar.style.width=np+"%";
let weekAgo=new Date();weekAgo.setDate(new Date().getDate()-7);
weeklyWorkoutCount.textContent=workoutLogs.filter(x=>new Date(x.date)>=weekAgo).length;
}

function loadData(){
onSnapshot(query(collection(db,"gymWorkoutLogs")),snap=>{
workoutLogs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.userId===currentUser.uid).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
renderHistories();renderStats();
});
onSnapshot(query(collection(db,"gymNutritionLogs")),snap=>{
nutritionLogs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.userId===currentUser.uid).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
renderHistories();renderStats();
});
}

renderProgram();
renderNutritionChecklist();
</script>
</body>
</html>
